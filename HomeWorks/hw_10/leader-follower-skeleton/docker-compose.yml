version: "3.8"

services:
  leader:
    build: .
    container_name: leader
    environment:
      - ROLE=leader
      - NODE_ID=leader
      - PORT=8080
      - WRITE_MODE=W3
      - READ_MODE=R3
      - FOLLOWERS=http://follower1:8080,http://follower2:8080,http://follower3:8080,http://follower4:8080
    ports:
      - "8080:8080"

  follower1:
    build: .
    container_name: follower1
    environment:
      - ROLE=follower
      - NODE_ID=follower1
      - PORT=8080
      - WRITE_MODE=W3
      - READ_MODE=R3
      - FOLLOWERS=
    ports:
      - "8081:8080"

  follower2:
    build: .
    container_name: follower2
    environment:
      - ROLE=follower
      - NODE_ID=follower2
      - PORT=8080
      - WRITE_MODE=W3
      - READ_MODE=R3
      - FOLLOWERS=
    ports:
      - "8082:8080"

  follower3:
    build: .
    container_name: follower3
    environment:
      - ROLE=follower
      - NODE_ID=follower3
      - PORT=8080
      - WRITE_MODE=W3
      - READ_MODE=R3
      - FOLLOWERS=
    ports:
      - "8083:8080"

  follower4:
    build: .
    container_name: follower4
    environment:
      - ROLE=follower
      - NODE_ID=follower4
      - PORT=8080
      - WRITE_MODE=W3
      - READ_MODE=R3
      - FOLLOWERS=
    ports:
      - "8084:8080"